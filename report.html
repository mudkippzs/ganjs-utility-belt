<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Report - Ganj's Utility Belt</title>
  <link rel="stylesheet" href="report.css">
  <script src="libs/chart.min.js"></script>
</head>
<body>
  <div class="header">
    <h1>📊 Focus Report</h1>
    <div class="controls">
      <select id="rangeSelect">
        <option value="today">Today</option>
        <option value="week" selected>Last 7 Days</option>
        <option value="month">This Month</option>
        <option value="all">All Time</option>
      </select>
      <button class="btn-export" id="exportBtn">📥 Export CSV</button>
      <button class="btn-clear" id="clearBtn">🗑️ Clear</button>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card"><div class="stat-value" id="totalSessions">0</div><div class="stat-label">Sessions</div></div>
    <div class="stat-card"><div class="stat-value" id="totalMinutes">0</div><div class="stat-label">Minutes Focused</div></div>
    <div class="stat-card"><div class="stat-value" id="avgSession">0</div><div class="stat-label">Avg Min / Session</div></div>
    <div class="stat-card"><div class="stat-value" id="streak">0</div><div class="stat-label">Day Streak</div></div>
  </div>

  <div class="chart-container">
    <canvas id="reportChart"></canvas>
  </div>

  <div class="task-breakdown">
    <h3>📋 Task Breakdown</h3>
    <ul class="task-list" id="taskList"></ul>
  </div>

  <script src="report.js"></script>
</body>
</html>
