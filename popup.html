<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ganj's Utility Belt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="hud.css">
  <script src="modules/tabSetSaver.js"></script>
  <script src="modules/pomodoro.js"></script>
  <script src="icons/popup-icons.js"></script>
  <script src="popup.js" defer></script>
</head>
<body class="belt-hud">
  <header class="hud-chrome" role="banner">
    <div class="hud-chrome-brand">
      <span class="hud-mark" aria-hidden="true"></span>
      <div class="hud-chrome-titles">
        <span class="hud-codename">BELT</span>
        <span class="hud-subtitle">Workspace</span>
      </div>
    </div>
    <div class="hud-chrome-telemetry" aria-live="polite">
      <span class="hud-stat" id="tabStat" title="Open tabs in this window">— TABS</span>
      <span class="hud-mode" id="modeBadge" data-mode="idle" title="Focus system status — idle until a session starts">
        <span class="hud-status-dot" aria-hidden="true"></span>
        <span id="modeLabel">IDLE</span>
      </span>
    </div>
    <a href="options.html" target="_blank" class="hud-gear" title="Settings — durations, sticky notes, site URL maps">
      <span class="hud-icon" data-icon="settings"></span>
    </a>
  </header>

  <section id="contextRail" class="hud-context glass-panel" hidden>
    <div class="hud-panel-chrome">
      <span class="hud-bar" aria-hidden="true"></span>
      <span class="hud-panel-code" id="contextCode">SITE</span>
      <span class="hud-panel-title" id="contextTitle">Context tools</span>
    </div>
    <div id="siteToolsContainer" class="hud-chip-row" role="list"></div>
  </section>

  <main class="hud-main">
    <section class="hud-actions glass-panel" aria-label="Primary actions">
      <div class="hud-panel-chrome">
        <span class="hud-bar" aria-hidden="true"></span>
        <span class="hud-panel-code">OPS</span>
        <span class="hud-panel-title">Actions</span>
      </div>
      <div class="hud-tile-grid">
        <button type="button" class="hud-tile" id="openCrossTabSearch" title="Search text across open tabs — finds content Chrome tab search misses">
          <span class="hud-icon" data-icon="search"></span>
          <span class="hud-tile-label">Search</span>
        </button>
        <button type="button" class="hud-tile" id="openMediaScanner" title="Scan this page for images, video, audio — select and download">
          <span class="hud-icon" data-icon="media"></span>
          <span class="hud-tile-label">Media</span>
        </button>
        <button type="button" class="hud-tile" id="viewAllNotes" title="Open the notes index — all page notes across sites">
          <span class="hud-icon" data-icon="notes"></span>
          <span class="hud-tile-label">Notes</span>
        </button>
        <button type="button" class="hud-tile" id="groupTabs" title="Group tabs in this window by domain (pinned tabs stay ungrouped — Chrome limitation)">
          <span class="hud-icon" data-icon="group"></span>
          <span class="hud-tile-label">Group</span>
        </button>
        <button type="button" class="hud-tile" id="ungroupTabs" title="Remove all tab groups in this window">
          <span class="hud-icon" data-icon="ungroup"></span>
          <span class="hud-tile-label">Ungroup</span>
        </button>
        <button type="button" class="hud-tile" id="toggleSets" aria-expanded="false" aria-controls="setsPanel" title="Saved tab sets — restore a window of tabs later">
          <span class="hud-icon" data-icon="sets"></span>
          <span class="hud-tile-label">Sets</span>
        </button>
      </div>
    </section>

    <section id="setsPanel" class="hud-sets glass-panel" hidden>
      <div class="hud-panel-chrome">
        <span class="hud-bar hud-bar-teal" aria-hidden="true"></span>
        <span class="hud-panel-code">SETS</span>
        <span class="hud-panel-title">Saved windows</span>
      </div>
      <form id="saveForm" class="hud-set-form">
        <input type="text" id="setName" placeholder="Name this window…" required aria-label="Tab set name" title="Name for the current window’s tabs" />
        <button type="submit" class="hud-btn-compact" title="Save every tab in this window under that name">
          <span class="hud-icon" data-icon="save"></span>
        </button>
      </form>
      <div id="setsContainer" class="hud-sets-list"></div>
    </section>

    <section class="hud-focus glass-panel" aria-label="Focus timer" data-state="idle" id="focusPanel">
      <div class="hud-panel-chrome">
        <span class="hud-bar hud-bar-amber" aria-hidden="true"></span>
        <span class="hud-panel-code">FOCUS</span>
        <span class="hud-panel-title">Mission clock</span>
        <button type="button" id="viewReport" class="hud-linkish" title="Focus history — session log and chart">Report</button>
      </div>
      <div class="hud-focus-body">
        <div class="hud-timer-wrap">
          <div id="pomodoroTimer" class="hud-timer" aria-live="polite">25:00</div>
          <div class="hud-timer-sub" id="focusSub">Standby</div>
        </div>
        <input id="pomodoroTask" type="text" placeholder="Mission objective…" aria-label="Focus task" title="What you are protecting focus for — required to engage" />
        <div class="hud-focus-actions">
          <button type="button" id="pomodoroStart" class="hud-btn-primary" title="Start a focus session — alarm + optional floating timer">
            Engage
          </button>
          <button type="button" id="pomodoroCancel" class="hud-btn-danger" hidden title="Abort the current focus or break session">
            Abort
          </button>
        </div>
        <div class="hud-focus-opts">
          <label class="hud-check" title="Show a floating timer overlay on pages while a session runs">
            <input type="checkbox" id="toggleFloatingTimer" />
            <span>Float</span>
          </label>
          <label class="hud-check" title="Automatically start the next focus after a break ends">
            <input type="checkbox" id="toggleAutoFocus" />
            <span>Auto</span>
          </label>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
